[project]
name = "radiogrammer"
version = "0.1.0"
description = "NTS Radiogram Relay Application for APRS"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
keywords = ["amateur-radio", "aprs", "nts", "radiogram", "ham-radio"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Communications :: Ham Radio",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "pydantic>=2.12.5",
    "reportlab>=4.4.7",
    "pypdf>=6.5.0",
    "pillow>=12.1.0",
    "annotated-types>=0.7.0",
    "typing-extensions>=4.15.0",
]

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.0.0",
    "pytest>=7.0.0",
]

[project.scripts]
radiogrammer = "radiogrammer.radiogram_ui_relay:main"

[project.urls]
Homepage = "https://github.com/yourusername/radiogrammer"
Repository = "https://github.com/yourusername/radiogrammer"
Issues = "https://github.com/yourusername/radiogrammer/issues"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
radiogrammer = ["*.pdf"]
